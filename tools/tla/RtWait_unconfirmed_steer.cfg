    Budget = 1
    ReplyLen = 2
    NoticeLen = 2
    MaxTurns = 2
    MaxPosts = 1
    MaxSteers = 1
    MaxBare = 1
    MaxDrops = 1
    MaxWork = 1
    ExposeFailures = TRUE
    UseReceipts = FALSE
    PublishWork = TRUE
    Steering = TRUE
    Done = "current"
    MaxRequests = 0
    MaxResumes = 0
    InitialRequest = FALSE
