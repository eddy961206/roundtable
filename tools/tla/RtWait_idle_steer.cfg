\* Done = "idle" (b3a7b76) after a steer: the steered turn's reply is below after_seq.
\* expect: Invariant SleepsOnlyWhenUnfinished is violated.
SPECIFICATION Spec
CONSTANTS
    MaxRequests = 0
    MaxResumes = 0
    InitialRequest = FALSE
    Notify = "current"
    Budget = 1
    ReplyLen = 2
    NoticeLen = 2
    MaxTurns = 2
    MaxPosts = 1
    MaxSteers = 1
    MaxBare = 1
    MaxDrops = 1
    MaxWork = 0
    ExposeFailures = TRUE
    UseReceipts = TRUE
    PublishWork = TRUE
    Steering = TRUE
    Done = "idle"
INVARIANTS TypeOK ReadyHasAnswer SleepsOnlyWhenUnfinished
PROPERTIES FailureIsVisible ReadyOnlyWhenIdle WakesWhenFinished
CHECK_DEADLOCK FALSE
