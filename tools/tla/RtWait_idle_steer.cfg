\* Done = "idle" (b3a7b76) after a steer: the steered turn's reply is below after_seq.
\* expect: Invariant SleepsOnlyWhenUnfinished is violated.
SPECIFICATION Spec
CONSTANTS
    Budget = 1
    ReplyLen = 2
    NoticeLen = 2
    MaxTurns = 2
    MaxPosts = 1
    MaxSteers = 1
    MaxBare = 1
    MaxDrops = 1
    MaxWork = 0
    PublishWork = TRUE
    Steering = TRUE
    Done = "idle"
INVARIANTS TypeOK ReadyHasAnswer SleepsOnlyWhenUnfinished
PROPERTIES ReadyOnlyWhenIdle WakesWhenFinished
CHECK_DEADLOCK FALSE
