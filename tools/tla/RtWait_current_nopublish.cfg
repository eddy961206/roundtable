\* Done = "current" on the server before publishList: a work step that fails back to idle sends no signal.
\* expect: Invariant SleepsOnlyWhenUnfinished is violated.
SPECIFICATION Spec
CONSTANTS
    Budget = 1
    ReplyLen = 2
    NoticeLen = 2
    MaxTurns = 2
    MaxPosts = 1
    MaxSteers = 1
    MaxBare = 1
    MaxDrops = 1
    MaxWork = 1
    PublishWork = FALSE
    Steering = FALSE
    Done = "current"
INVARIANTS TypeOK ReadyHasAnswer SleepsOnlyWhenUnfinished
PROPERTIES ReadyOnlyWhenIdle WakesWhenFinished
CHECK_DEADLOCK FALSE
