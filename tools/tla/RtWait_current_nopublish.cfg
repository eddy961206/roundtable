\* Done = "current" on the server before publishList: a work step that fails back to idle sends no signal.
\* expect: Invariant SleepsOnlyWhenUnfinished is violated.
SPECIFICATION Spec
CONSTANTS
    MaxRequests = 0
    MaxResumes = 0
    InitialRequest = FALSE
    Notify = "current"
    Budget = 1
    ReplyLen = 2
    NoticeLen = 2
    MaxTurns = 2
    MaxPosts = 1
    MaxSteers = 1
    MaxBare = 1
    MaxDrops = 1
    MaxWork = 1
    ExposeFailures = TRUE
    UseReceipts = TRUE
    PublishWork = FALSE
    Steering = FALSE
    Done = "current"
INVARIANTS TypeOK ReadyHasAnswer SleepsOnlyWhenUnfinished
PROPERTIES FailureIsVisible ReadyOnlyWhenIdle WakesWhenFinished
CHECK_DEADLOCK FALSE
