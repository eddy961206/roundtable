\* Done = "window" (before 5d6506c): max_chars 1 against replies and notices of 2 characters.
\* expect: Invariant SleepsOnlyWhenUnfinished is violated.
\* ReadyOnlyWhenIdle is left out: RtWait_replied.cfg shows that race.
SPECIFICATION Spec
CONSTANTS
    MaxRequests = 0
    MaxResumes = 0
    InitialRequest = FALSE
    Notify = "current"
    Budget = 1
    ReplyLen = 2
    NoticeLen = 2
    MaxTurns = 2
    MaxPosts = 1
    MaxSteers = 1
    MaxBare = 1
    MaxDrops = 1
    MaxWork = 0
    ExposeFailures = TRUE
    UseReceipts = TRUE
    PublishWork = TRUE
    Steering = FALSE
    Done = "window"
INVARIANTS TypeOK ReadyHasAnswer SleepsOnlyWhenUnfinished
PROPERTIES FailureIsVisible WakesWhenFinished
CHECK_DEADLOCK FALSE
