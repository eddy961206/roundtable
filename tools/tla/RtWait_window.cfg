\* Done = "window". max_chars 1 against replies and notices of 2 characters.
\* ReadyOnlyWhenIdle is left out: RtWait_replied.cfg shows that race.
SPECIFICATION Spec
CONSTANTS
    Budget = 1
    ReplyLen = 2
    NoticeLen = 2
    MaxTurns = 2
    MaxPosts = 1
    MaxSteers = 1
    MaxBare = 1
    MaxDrops = 1
    Done = "window"
INVARIANTS TypeOK ReadyHasReply SleepsOnlyWhenUnfinished
PROPERTIES WakesWhenFinished
CHECK_DEADLOCK FALSE
