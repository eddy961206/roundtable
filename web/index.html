<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roundtable</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪑</text></svg>">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <h1>Roundtable</h1>
      <button id="btn-new-room" class="primary">+ 새 방</button>
    </div>
    <ul id="room-list"></ul>
    <div id="provider-panel">
      <h2>공급사 한도</h2>
      <div id="limits"></div>
    </div>
  </aside>

  <main id="main">
    <div id="empty" class="empty">왼쪽에서 방을 고르거나 새 방을 만들어.</div>
    <section id="room" hidden>
      <header id="room-head">
        <div class="title-row">
          <h2 id="room-title"></h2>
          <span id="room-mode" class="badge"></span>
          <span id="room-ws" class="muted mono"></span>
        </div>
        <div id="token-strip" class="token-strip"></div>
        <div class="actions">
          <label class="rounds">라운드 <input id="rounds" type="number" min="1" max="10" value="3"></label>
          <button id="btn-discuss">토론 시작</button>
          <button id="btn-stop" class="danger" title="실행 중인 모든 턴을 끊고 대기열과 토론을 비운다. 한 턴만 끊으려면 오른쪽 대기열에서 중단.">모두 중지</button>
          <button id="btn-reset" title="각 에이전트의 CLI 세션을 버리고 다음 턴부터 대화 전체를 새로 읽게 함">세션 초기화</button>
          <a id="btn-export" class="button" download>내보내기</a>
          <button id="btn-settings">설정</button>
          <button id="btn-right" title="참가자·대기열 패널 보이기/숨기기 (좁은 화면)">참가자</button>
          <button id="btn-delete" class="danger ghost">방 삭제</button>
        </div>
      </header>
      <div id="timeline"></div>
      <div id="discussion-bar" hidden></div>
      <footer id="composer">
        <div id="mention-pop" hidden></div>
        <div class="composer-row">
          <select id="target" title="대상을 고르면 그 에이전트에게만 보냄. 실행 중이면 Claude는 즉시 끼어들고(steering), Codex·Antigravity는 다음 턴에 전달.">
            <option value="">전체 (@멘션 규칙)</option>
          </select>
          <textarea id="input" rows="2" placeholder="메시지… (@claude @codex @agy @all 로 호출, 멘션 없으면 전원에게. Enter 전송, Shift+Enter 줄바꿈)"></textarea>
          <button id="btn-send" class="primary">보내기</button>
        </div>
        <div id="composer-hint" class="muted"></div>
      </footer>
    </section>
  </main>

  <aside id="right">
    <h2>참가자</h2>
    <div id="participants"></div>
    <h2>대기열</h2>
    <ul id="queue"></ul>
  </aside>
</div>

<dialog id="dlg-room">
  <form method="dialog" id="form-room">
    <h3 id="dlg-room-title">새 방</h3>
    <label>방 이름 <input name="title" required placeholder="예: SP5 클립 설계 검토"></label>
    <label>작업 폴더 <input name="workspace" placeholder="D:\WorkSpaces\...\VMS"></label>
    <label>권한 모드
      <select name="mode">
        <option value="read">read — 폴더 읽기·검색만 (추천)</option>
        <option value="chat">chat — 도구 없이 대화만</option>
        <option value="write">write — 파일 수정 허용 (샌드박스 안, 우회 없음)</option>
      </select>
    </label>
    <label>방 공지 (모든 에이전트에게 항상 보이는 맥락)
      <textarea name="note" rows="3" placeholder="예: 이 방은 Go VMS의 녹화 보존 설계를 검토한다. 결정은 사람이 내린다."></textarea>
    </label>
    <div class="row">
      <label>참가자
        <span class="checks">
          <label><input type="checkbox" name="p" value="claude" checked> Claude</label>
          <label><input type="checkbox" name="p" value="codex" checked> Codex</label>
          <label><input type="checkbox" name="p" value="agy" checked> Antigravity</label>
        </span>
      </label>
    </div>
    <div class="row">
      <label>연쇄 호출 한도 <input name="max_chain" type="number" min="1" max="20" value="4"></label>
      <label>기본 토론 라운드 <input name="discussion_rounds" type="number" min="1" max="10" value="3"></label>
      <label class="inline"><input type="checkbox" name="persona"> 에이전트끼리 가벼운 티격태격 허용</label>
    </div>
    <menu>
      <button value="cancel" type="button" id="dlg-room-cancel">취소</button>
      <button value="ok" class="primary" id="dlg-room-ok">만들기</button>
    </menu>
  </form>
</dialog>

<script src="vendor/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
